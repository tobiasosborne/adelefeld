<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" role="img" aria-labelledby="title desc">
<title id="title">The rational 22/7 at the real place and at the primes 2, 3 and 5</title>
<desc id="desc">real: 3.142857 +/- 1.5e-7. 2: 0 + O(2^1) then 2: 2 + O(2^2) then 2: 2 + O(2^3) then 2: 10 + O(2^4); 3: 1 + O(3^1) then 3: 7 + O(3^2) then 3: 7 + O(3^3) then 3: 61 + O(3^4); 5: 1 + O(5^1) then 5: 21 + O(5^2) then 5: 21 + O(5^3) then 5: 271 + O(5^4)</desc>
