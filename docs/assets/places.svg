<text x="28" y="40" class="h">One rational, every place at once: 22/7</text>
<text x="28" y="62" class="s">Top: the real line. Below: the p-adic integers for p = 2, 3, 5 as trees. A node at depth k is a ball a + p^k Z_p,</text>
<text x="28" y="79" class="s">and its p children fix the next base-p digit. The gold thread is 22/7: one point of the real line, one path in every tree.</text>
