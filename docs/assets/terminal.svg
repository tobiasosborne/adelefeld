<title id="title">A session of the adelefeld driver build/adf</title>
<desc id="desc">echo 'add (0 ; 0) with 22/7' | build/adf gives (3.142857142857142857 +/- 2.4e-19 ; 22/7); echo 'project 22/7 with real 2 3 5 7' | build/adf gives real: 3.142857142857142857 +/- 2.4e-19; 2: 22/7; 3: 22/7; 5: 22/7; 7: 22/7; printf 'prec 6\nroots_at -1 with 5 with 2\n' | build/adf gives 5 [2]: 14557 + O(5^6); 5 [3]: 1068 + O(5^6); echo 'roots_at -1 with 3 with 2' | build/adf gives error: DOMAIN; echo 'mul (3.0 +/- 0.1 ; 146 mod 1000) with 7' | build/adf gives (21 +/- 0.71 ; 1022 mod 7000); echo 'sin_at (* ; 0 mod 2) with 2' | build/adf gives error: NOT_DETERMINED; echo 'recover 146 mod 1000 with 30 with 15' | build/adf gives 22/7</desc>
